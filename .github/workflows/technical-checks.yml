name: Technical checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - name: Run tests, syntax checks and scenario replay
        run: python scripts/readiness_report.py --output readiness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technical-readiness
          path: readiness.json
