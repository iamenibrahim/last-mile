name: Deploy Azure Function App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-function-app-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install verification tools
        run: python -m pip install -r requirements-dev.txt pip-audit bandit

      - name: Gate deployment on technical checks
        run: python scripts/readiness_report.py

      - name: Gate deployment on dependency and security scans
        run: |
          pip-audit -r requirements.txt
          bandit -r api grounded functions -x tests -q -ll -ii

      - name: Install application dependencies
        run: pip install --target=".python_packages/lib/site-packages" -r requirements.txt

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: lmva3fcshw5lauukqapi
          package: .
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
