name: Production availability probe

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check health and provider status
        shell: bash
        run: |
          set -euo pipefail
          base="https://lmva3fcshw5lauukqapi.azurewebsites.net"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "$base/healthz" | grep -q '"ok":true'
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "$base/api/status" | grep -q '"status":"ready"'
